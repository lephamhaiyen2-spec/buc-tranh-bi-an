<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trò Chơi Ô Chữ: Khám Phá Đồng Nai</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { 
        font-family: 'Montserrat', sans-serif; 
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
        color: #f8fafc; 
        min-height: 100vh; 
        overflow-x: hidden;
    }
    .letter-box { 
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        transform-style: preserve-3d; 
    }
    .flip { 
        transform: rotateX(360deg); 
    }
    .glow-vertical { 
        box-shadow: 0 0 20px rgba(250, 204, 21, 0.7); 
        border-color: #facc15 !important; 
    }
    @keyframes pulse-red { 
        0%, 100% { background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); } 
        50% { background-color: rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.9); } 
    }
    .timeout-pulse { 
        animation: pulse-red 1s infinite; 
    }
    
    ::-webkit-scrollbar { height: 10px; width: 10px; }
    ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.6); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.9); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    let audioCtx = null;
    const getAudioContext = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    };

    const playSound = (type) => {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start(); osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'reveal') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
          osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start(); osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'tick') {
          // Âm thanh tích tắc mỗi giây
          osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start(); osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'timeout') {
          // Âm thanh báo hết giờ
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.6);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
          osc.start(); osc.stop(ctx.currentTime + 0.6);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.15);
            g.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.15);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.15 + 0.3);
            o.start(ctx.currentTime + idx * 0.15); o.stop(ctx.currentTime + idx * 0.15 + 0.3);
          });
        }
      } catch (e) { console.warn("Trình duyệt chặn âm thanh, vui lòng tương tác với trang trước."); }
    };

    const QUESTIONS = [
      { id: 1, q: "Địa danh nào được xem là trung tâm đô thị lâu đời, gắn với quá trình hình thành vùng đất Đồng Nai?", a: "BIEN HOA", raw: "BIENHOA", keyIdx: 0, offset: 10 },
      { id: 2, q: "Khu vực gắn với hệ sinh thái rừng, hồ Trị An và nhiều giá trị về bảo tồn thiên nhiên của Đồng Nai?", a: "VINH CUU", raw: "VINHCUU", keyIdx: 5, offset: 5 },
      { id: 3, q: "Đảo nằm trên sông Đồng Nai, từng là thương cảng sầm uất trong lịch sử vùng đất phương Nam?", a: "CU LAO PHO", raw: "CULAOPHO", keyIdx: 4, offset: 6 },
      { id: 4, q: "Nghề thủ công truyền thống nổi tiếng của Đồng Nai, từng được xem là một trong những dòng gốm tiêu biểu của Việt Nam?", a: "GOM BIEN HOA", raw: "GOMBIENHOA", keyIdx: 4, offset: 6 },
      { id: 5, q: "Công trình hạ tầng hàng không quốc gia đang được xây dựng tại Đồng Nai có tên là gì?", a: "SAN BAY LONG THANH", raw: "SANBAYLONGTHANH", keyIdx: 10, offset: 0 },
      { id: 6, q: "Hồ nước nhân tạo lớn của Đồng Nai, gắn với nhà máy thủy điện và cảnh quan du lịch sinh thái?", a: "HO TRI AN", raw: "HOTRIAN", keyIdx: 5, offset: 5 },
      { id: 7, q: "Vườn quốc gia nổi tiếng với hệ sinh thái rừng nhiệt đới và đa dạng sinh học nằm trên địa bàn Đồng Nai?", a: "CAT TIEN", raw: "CATTIEN", keyIdx: 6, offset: 4 },
      { id: 8, q: "Khu vực nào của Đồng Nai nổi bật với sự phát triển công nghiệp, hệ thống cảng và có vị trí quan trọng trong vùng kinh tế phía Nam?", a: "NHON TRACH", raw: "NHONTRACH", keyIdx: 4, offset: 6 },
      { id: 9, q: "Khu rừng lịch sử nổi tiếng ở Đồng Nai, gắn với vùng căn cứ cách mạng trong kháng chiến và hệ sinh thái tự nhiên đặc sắc là gì?", a: "RUNG MA DA", raw: "RUNGMADA", keyIdx: 0, offset: 10 },
      { id: 10, q: "Địa danh nào của Đồng Nai nổi tiếng với thắng cảnh Đá Ba Chồng – một di tích danh thắng gắn với giá trị tự nhiên và văn hóa địa phương?", a: "DINH QUAN", raw: "DINHQUAN", keyIdx: 1, offset: 9 },
      { id: 11, q: "Công trình văn hóa được xây dựng năm 1715, được xem là biểu tượng của truyền thống hiếu học và văn hóa vùng đất Đồng Nai?", a: "VAN MIEU TRAN BIEN", raw: "VANMIEUTRANBIEN", keyIdx: 5, offset: 5 },
      { id: 12, q: "Địa danh nào ở Đồng Nai được biết đến là một điểm du lịch tâm linh nổi tiếng, gắn với công trình Trung tâm Hành hương và có cảnh quan hướng nhìn ra hồ Trị An?", a: "NUI CUI", raw: "NUICUI", keyIdx: 1, offset: 9 },
    ];

    function App() {
      const [selectedRow, setSelectedRow] = useState(null);
      const [revealedRows, setRevealedRows] = useState({});
      const [showKeyword, setShowKeyword] = useState(false);
      const [showWinModal, setShowWinModal] = useState(false);
      const [isQuestionModalOpen, setIsQuestionModalOpen] = useState(false);

      const [timerDuration, setTimerDuration] = useState(15);
      const [timeLeft, setTimeLeft] = useState(15);
      const [isRunning, setIsRunning] = useState(false);
      const timerRef = useRef(null);

      useEffect(() => {
        if (isRunning && timeLeft > 0) {
          timerRef.current = setTimeout(() => {
            playSound('tick'); // Phát tiếng tích tắc mỗi giây
            setTimeLeft(timeLeft - 1);
          }, 1000);
        } else if (timeLeft === 0 && isRunning) {
          setIsRunning(false);
          playSound('timeout'); // Phát tiếng báo hết giờ
        }
        return () => clearTimeout(timerRef.current);
      }, [isRunning, timeLeft]);

      const handleSelectRow = (idx) => {
        playSound('click');
        setSelectedRow(idx);
        setIsQuestionModalOpen(true); // Mở bảng câu hỏi lớn
        setIsRunning(false);
        setTimeLeft(timerDuration);
      };

      const handleRevealRow = (idx) => {
        playSound('reveal');
        setIsRunning(false);
        setIsQuestionModalOpen(false); // Đóng bảng câu hỏi
        setRevealedRows(prev => {
          const next = { ...prev, [idx]: true };
          if (Object.keys(next).length === QUESTIONS.length) {
            setTimeout(() => {
              setShowKeyword(true);
              setShowWinModal(true);
              playSound('win');
            }, 800);
          }
          return next;
        });
      };

      const handleToggleKeyword = () => {
        playSound('reveal');
        setShowKeyword(!showKeyword);
        if (!showKeyword) {
          setShowWinModal(true);
          playSound('win');
        }
      };

      const toggleTimer = () => {
        playSound('click');
        if (timeLeft === 0) setTimeLeft(timerDuration);
        setIsRunning(!isRunning);
      };

      const resetTimer = () => {
        playSound('click');
        setIsRunning(false);
        setTimeLeft(timerDuration);
      };

      const handleResetAll = () => {
        playSound('click');
        setRevealedRows({});
        setSelectedRow(null);
        setShowKeyword(false);
        setShowWinModal(false);
        setIsQuestionModalOpen(false);
        setIsRunning(false);
        setTimeLeft(timerDuration);
      };

      return (
        <div className="w-full min-h-screen p-2 md:p-4 flex flex-col items-center justify-center relative">
          
          {/* Header */}
          <header className="text-center w-full mb-3 md:mb-5 relative z-10">
            <h1 className="text-2xl md:text-3xl lg:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-yellow-500 uppercase tracking-widest drop-shadow-sm">
              Khám Phá Đồng Nai
            </h1>
            <p className="text-indigo-200 mt-1 text-sm md:text-base font-medium tracking-wide">Trò chơi lật mở từ khóa đặc biệt</p>
          </header>

          {/* Lưới Ô Chữ (Căn giữa toàn màn hình) */}
          <div className="w-full max-w-[1200px] flex-1 flex flex-col items-center z-10">
            <div className="bg-slate-900/90 p-3 md:p-5 rounded-[20px] shadow-2xl border border-slate-700/60 overflow-x-auto w-full flex justify-center">
              <div className="flex flex-col gap-1.5 md:gap-2 lg:gap-2.5 mx-auto w-max">
                {QUESTIONS.map((item, idx) => {
                  const isRevealed = revealedRows[idx];
                  const chars = item.a.split('');

                  return (
                    <div 
                      key={item.id} 
                      onClick={() => handleSelectRow(idx)}
                      className={`flex items-center gap-1 p-1 rounded-lg cursor-pointer transition-all duration-300 hover:bg-slate-800/80 hover:scale-[1.02]`}
                    >
                      {/* Cột số thứ tự */}
                      <button className={`w-8 h-8 md:w-9 md:h-9 shrink-0 rounded-md font-black text-sm flex items-center justify-center transition-all ${
                        isRevealed ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/40' : 'bg-slate-700 text-slate-200'
                      }`}>
                        {item.id}
                      </button>

                      {/* Các khoảng trống lùi đầu dòng */}
                      {Array.from({ length: item.offset }).map((_, i) => (
                        <div key={`empty-${i}`} className="w-8 h-8 md:w-9 md:h-9 shrink-0"></div>
                      ))}

                      {/* Từng ô chữ cái */}
                      {chars.map((char, charIdx) => {
                        if (char === ' ') return <div key={`space-${charIdx}`} className="w-2 shrink-0"></div>;
                        const rawIndex = item.a.slice(0, charIdx).replace(/\s/g, '').length;
                        const isKeyCell = rawIndex === item.keyIdx;

                        return (
                          <div
                            key={`cell-${charIdx}`}
                            className={`w-8 h-8 md:w-9 md:h-9 shrink-0 rounded-md flex items-center justify-center font-bold text-sm md:text-base border-2 letter-box ${
                              isRevealed ? 'flip' : ''
                            } ${
                              isKeyCell 
                                ? (isRevealed || showKeyword)
                                  ? 'bg-gradient-to-br from-yellow-400 to-amber-600 text-slate-950 font-black border-yellow-300 glow-vertical scale-110 z-10' 
                                  : 'bg-yellow-500/20 border-yellow-500/50 text-transparent'
                                : isRevealed 
                                  ? 'bg-slate-100 text-slate-900 border-white shadow-md' 
                                  : 'bg-slate-800 border-slate-600/80 text-transparent'
                            }`}
                          >
                            {isRevealed ? char : (isKeyCell && showKeyword ? char : '')}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Các nút điều khiển chung (Bố trí dưới bảng ô chữ) */}
            <div className="flex flex-col md:flex-row gap-4 mt-6 w-full max-w-2xl justify-center">
              <button
                onClick={handleToggleKeyword}
                className="flex-1 py-3.5 px-6 rounded-xl font-black text-sm md:text-base text-slate-950 bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 hover:from-yellow-300 hover:to-amber-400 shadow-lg shadow-yellow-500/20 uppercase tracking-wide transition-all hover:scale-[1.02]"
              >
                ✨ {showKeyword ? 'ẨN TỪ KHÓA DỌC' : 'MỞ TỪ KHÓA DỌC'}
              </button>

              <button
                onClick={handleResetAll}
                className="flex-1 py-3.5 px-6 rounded-xl font-bold text-sm md:text-base text-slate-300 bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all hover:scale-[1.02]"
              >
                🔄 LÀM MỚI BẢNG CHƠI
              </button>
            </div>
          </div>

          {/* Modal Câu Hỏi Che Toàn Màn Hình */}
          {isQuestionModalOpen && selectedRow !== null && (
            <div className="fixed inset-0 z-40 bg-slate-950/95 backdrop-blur-sm flex items-center justify-center p-4 md:p-8 animate-fade-in">
              <div className="max-w-5xl w-full bg-gradient-to-br from-indigo-900/90 to-slate-900/95 p-6 md:p-10 rounded-[30px] border border-indigo-500/40 shadow-2xl relative flex flex-col min-h-[500px]">
                
                {/* Nút đóng */}
                <button 
                  onClick={() => setIsQuestionModalOpen(false)}
                  className="absolute top-5 right-5 w-12 h-12 bg-slate-800/80 hover:bg-red-500/80 text-white rounded-full flex items-center justify-center text-xl font-bold transition-all border border-slate-600"
                >
                  ✕
                </button>

                <div className="flex flex-col gap-3 mb-6">
                  <span className="px-5 py-2 rounded-lg bg-indigo-500/30 text-indigo-200 text-lg font-bold uppercase tracking-wider border border-indigo-500/50 w-fit">
                    Câu hỏi số {QUESTIONS[selectedRow].id}
                  </span>
                  <span className="text-lg text-yellow-400 font-bold bg-slate-900/80 px-4 py-1.5 rounded-md border border-slate-700/50 w-fit">
                    ĐÁP ÁN GỒM {QUESTIONS[selectedRow].raw.length} CHỮ CÁI
                  </span>
                </div>
                
                {/* Văn bản câu hỏi cực lớn */}
                <div className="flex-1 flex items-center">
                  <p className="text-[28px] md:text-[34px] lg:text-[40px] leading-[1.4] text-white font-semibold">
                    {QUESTIONS[selectedRow].q}
                  </p>
                </div>

                <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
                  {/* Cụm điều khiển đồng hồ */}
                  <div className={`p-4 md:p-5 rounded-2xl border-2 transition-all flex gap-5 items-center shadow-lg ${
                    timeLeft === 0 ? 'bg-red-950/90 border-red-500 timeout-pulse' : 'bg-slate-900/90 border-slate-600'
                  }`}>
                    <div className="text-[50px] md:text-[60px] leading-none font-black font-mono w-[100px] text-center text-yellow-400 bg-slate-950 py-2 rounded-xl border-2 border-slate-800 shadow-inner tracking-widest shrink-0">
                      {timeLeft}
                    </div>
                    
                    <div className="flex flex-col gap-2 w-full">
                      <div className="flex gap-2">
                        {[15, 30, 60].map(sec => (
                          <button 
                            key={sec}
                            onClick={() => { setTimerDuration(sec); setTimeLeft(sec); setIsRunning(false); }}
                            className={`flex-1 py-1 text-xs md:text-sm rounded-lg font-bold border-2 transition-all ${
                              timerDuration === sec ? 'bg-indigo-600 text-white border-indigo-400' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'
                            }`}
                          >
                            {sec}s
                          </button>
                        ))}
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={toggleTimer}
                          className={`flex-1 py-2 rounded-xl font-extrabold text-sm flex items-center justify-center gap-1 shadow-lg transition-all ${
                            isRunning ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-emerald-600 hover:bg-emerald-500 text-white'
                          }`}
                        >
                          {isRunning ? '⏸ TẠM DỪNG' : (timeLeft === 0 ? '🔁 LÀM LẠI' : '▶ BẮT ĐẦU')}
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Nút lật mở đáp án */}
                  <button
                    onClick={() => handleRevealRow(selectedRow)}
                    className="h-full py-5 px-6 rounded-2xl font-extrabold text-[22px] md:text-[26px] bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg shadow-emerald-500/30 border-2 border-emerald-400/50 hover:scale-[1.02] transition-all flex items-center justify-center"
                  >
                    💡 MỞ ĐÁP ÁN NÀY
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Chiến Thắng (Từ khóa dọc) */}
          {showWinModal && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-lg flex items-center justify-center p-4 z-50 animate-fade-in">
              
              {/* Nút mũi tên đỏ quay lại góc trên trái */}
              <button
                onClick={() => setShowWinModal(false)}
                className="absolute top-6 left-6 md:top-10 md:left-10 w-14 h-14 md:w-16 md:h-16 bg-slate-900/50 hover:bg-red-500/20 border-2 border-red-500 rounded-full flex items-center justify-center text-red-500 hover:text-red-400 shadow-[0_0_15px_rgba(239,68,68,0.5)] transition-all z-50 group cursor-pointer"
                title="Quay lại bảng ô chữ"
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 md:h-10 md:w-10 group-hover:-translate-x-1.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
              </button>

              <div className="bg-gradient-to-b from-indigo-900 to-slate-900 border-4 border-yellow-400 p-6 md:p-10 rounded-[30px] max-w-3xl w-full text-center shadow-[0_0_80px_rgba(250,204,21,0.25)] relative overflow-hidden">
                <div className="absolute -right-20 -top-20 w-60 h-60 bg-yellow-500/20 rounded-full blur-3xl pointer-events-none"></div>
                <div className="text-[60px] md:text-[80px] mb-4 animate-bounce">🍊🎉</div>
                <h3 className="text-yellow-400 font-extrabold text-[18px] md:text-[22px] tracking-widest uppercase mb-3">Từ Khóa Hàng Dọc</h3>
                <h2 className="text-[40px] md:text-[60px] font-black text-white tracking-wide uppercase mb-6 drop-shadow-lg leading-tight">
                  BUOI TAN TRIEU
                </h2>
                <p className="text-indigo-100 text-[16px] md:text-[20px] leading-[1.6] mb-8 bg-indigo-950/60 p-5 md:p-6 rounded-2xl border-2 border-indigo-500/40">
                  Chúc mừng! Bạn đã tìm ra <b>Bưởi Tân Triều</b> - đặc sản trứ danh của vùng đất ven sông Đồng Nai (xã Tân Bình, huyện Vĩnh Cửu), nổi tiếng với hương vị ngọt thanh, mọng nước và bề dày lịch sử hàng trăm năm.
                </p>
                
                <div className="flex flex-col md:flex-row gap-4 justify-center">
                  <button
                    onClick={handleResetAll}
                    className="py-3 px-8 rounded-2xl font-bold text-slate-300 bg-slate-800 hover:bg-slate-700 border-2 border-slate-600 uppercase tracking-wider text-[16px] md:text-[18px] transition-transform hover:scale-105"
                  >
                    Chơi Lại Từ Đầu
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
