<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle tế bào thực vật</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#dff7e4,#fff);color:#173b25;text-align:center}h1{margin:14px 0 4px;font-size:28px}.sub{margin:0 0 10px}.wrap{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}.panel{background:#fff;border-radius:18px;padding:12px;box-shadow:0 8px 24px #0002}canvas{touch-action:none;border-radius:12px;background:#f7fff8;max-width:92vw;height:auto}button{border:0;border-radius:12px;padding:10px 18px;background:#28a745;color:white;font-weight:700;cursor:pointer;margin:5px}.info{max-width:680px;margin:10px auto;background:#ffffffd9;border-radius:14px;padding:10px}.ok{color:#16823a;font-weight:bold}</style></head><body><h1>🌿 Ghép tranh: TẾ BÀO THỰC VẬT</h1><p class="sub">20 mảnh • Kéo từng mảnh vào đúng vị trí • Quan sát <b>màng tế bào – tế bào chất – nhân</b></p><div class="wrap"><div class="panel"><canvas id="c" width="800" height="600"></canvas><br><button onclick="shuffle()">🔀 Trộn lại</button><button onclick="resetGame()">↻ Chơi lại</button></div></div><div class="info" id="msg">Mẹo: ghép các mảnh có hình ảnh liên tục và khớp lồi/lõm.</div><script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=800,H=600,cols=5,rows=4,pw=160,ph=150;let pieces=[],drag=null,ox=0,oy=0;const img=new Image();
function svg(){return `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><radialGradient id="bg"><stop stop-color="#f5ffe8"/><stop offset="1" stop-color="#b7e48f"/></radialGradient><radialGradient id="n"><stop stop-color="#b58cff"/><stop offset="1" stop-color="#633bb6"/></radialGradient><linearGradient id="v" x2="1" y2="1"><stop stop-color="#49b96b"/><stop offset="1" stop-color="#176b38"/></linearGradient><filter id="s"><feDropShadow dx="4" dy="5" stdDeviation="5" flood-opacity=".25"/></filter></defs><rect width="800" height="600" fill="url(#bg)"/><ellipse cx="400" cy="300" rx="340" ry="245" fill="#5bbd6f" opacity=".45" filter="url(#s)"/><rect x="70" y="70" width="660" height="460" rx="70" fill="#b8f08a" stroke="#246b35" stroke-width="18"/><rect x="90" y="90" width="620" height="420" rx="58" fill="#d9ffb0" stroke="#55a84b" stroke-width="9"/><g fill="#55bd62" stroke="#287d3c" stroke-width="5">${[120,190,260,540,610,680].map((cx,i)=>`<ellipse cx="${cx}" cy="${130+(i%2)*320}" rx="30" ry="52"/>`).join('')}</g><ellipse cx="430" cy="315" rx="100" ry="92" fill="url(#n)" stroke="#4c2a94" stroke-width="9"/><circle cx="400" cy="290" r="22" fill="#d7c6ff" opacity=".8"/><path d="M160 230 Q280 170 360 225 T700 230 M150 390 Q260 450 370 385 T690 390" fill="none" stroke="#75d88a" stroke-width="16" opacity=".8"/><text x="400" y="570" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#1d572b">TẾ BÀO THỰC VẬT</text></svg>`}img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg());img.onload=()=>resetGame();
function tabs(r,c){let t={t:0,r:0,b:0,l:0};if(r>0)t.t=Math.random()>.5?1:-1;if(c<cols-1)t.r=Math.random()>.5?1:-1;if(r<rows-1)t.b=Math.random()>.5?1:-1;if(c>0)t.l=-pieces[(r*cols+c)-1].tabs.r;return t}
function resetGame(){pieces=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let p={r,c,x:c*pw+30,y:r*ph+20,homeX:c*pw+30,homeY:r*ph+20,tabs:{}};p.tabs=tabs(r,c);pieces.push(p)};shuffle()}
function shuffle(){pieces.forEach((p,i)=>{p.x=35+Math.random()*(W-pw-70);p.y=20+Math.random()*(H-ph-70);p.done=false});draw();document.getElementById('msg').textContent='Kéo 20 mảnh vào đúng vị trí. Khi ghép đủ, tranh hoàn chỉnh sẽ hiện!'}
function path(ctx,p){let X=p.x,Y=p.y;ctx.beginPath();for(let e=0;e<4;e++){let tab=e===0?p.tabs.t:e===1?p.tabs.r:e===2?p.tabs.b:p.tabs.l;let x1=e===0?X:e===1?X+pw:e===2?X+pw:X,y1=e===0?Y:e===1?Y:y= e===2?Y+ph:Y+ph; if(e===0){ctx.moveTo(X,Y);ctx.lineTo(X+pw/2-18,Y);ctx.bezierCurveTo(X+pw/2-18,Y-25*tab,X+pw/2+18,Y-25*tab,X+pw/2+18,Y);ctx.lineTo(X+pw,Y)}else if(e===1){ctx.moveTo(X+pw,Y);ctx.lineTo(X+pw,Y+ph/2-18);ctx.bezierCurveTo(X+pw+25*tab,Y+ph/2-18,X+pw+25*tab,Y+ph/2+18,X+pw,Y+ph/2+18);ctx.lineTo(X+pw,Y+ph)}else if(e===2){ctx.moveTo(X+pw,Y+ph);ctx.lineTo(X+pw/2+18,Y+ph);ctx.bezierCurveTo(X+pw/2+18,Y+ph+25*tab,X+pw/2-18,Y+ph+25*tab,X+pw/2-18,Y+ph);ctx.lineTo(X,Y+ph)}else{ctx.moveTo(X,Y+ph);ctx.lineTo(X,Y+ph/2+18);ctx.bezierCurveTo(X-25*tab,Y+ph/2+18,X-25*tab,Y+ph/2-18,X,Y+ph/2-18);ctx.lineTo(X,Y)}}ctx.closePath()}
function draw(){x.clearRect(0,0,W,H);x.globalAlpha=.16;x.drawImage(img,0,0);x.globalAlpha=1;pieces.forEach(p=>{x.save();path(x,p);x.clip();x.drawImage(img,p.r*pw,p.c*0,pw,ph,p.x,p.y,pw,ph);x.restore();x.save();path(x,p);x.strokeStyle='#145b2b';x.lineWidth=3;x.stroke();x.restore()})}
cv.onpointerdown=e=>{let q=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(q.x>=p.x-15&&q.x<=p.x+pw+15&&q.y>=p.y-15&&q.y<=p.y+ph+15){drag=p;ox=q.x-p.x;oy=q.y-p.y;pieces.splice(i,1);pieces.push(p);break}}};cv.onpointermove=e=>{if(drag){let q=pt(e);drag.x=q.x-ox;drag.y=q.y-oy;draw()}};cv.onpointerup=e=>{if(!drag)return;let dx=drag.x-drag.homeX,dy=drag.y-drag.homeY;if(Math.hypot(dx,dy)<28){drag.x=drag.homeX;drag.y=drag.homeY;drag.done=true}else drag.done=false;drag=null;draw();if(pieces.every(p=>p.done)){document.getElementById('msg').innerHTML='<span class="ok">🎉 Tuyệt vời! Em đã hoàn thành tế bào thực vật.</span>'}};function pt(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}</script></body></html>
