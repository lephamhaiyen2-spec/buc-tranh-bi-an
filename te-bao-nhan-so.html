<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle tế bào nhân sơ</title><style>body{text-align:center;font-family:Arial;background:linear-gradient(135deg,#e2f0ff,#fff)}h1{color:#245b91}canvas{max-width:94vw;border-radius:16px;box-shadow:0 8px 25px #0002;background:white;touch-action:none}button{padding:10px 18px;border:0;border-radius:12px;background:#3182ce;color:#fff;font-weight:bold;margin:8px}</style><h1>🦠 GHÉP TRANH – TẾ BÀO NHÂN SƠ</h1><p>20 mảnh puzzle • Kéo mảnh vào đúng vị trí • Kiến thức đơn giản lớp 6</p><canvas id=c width=800 height=600></canvas><br><button onclick="mix()">🔀 Trộn mảnh</button><button onclick="location.reload()">↻ Chơi lại</button><p id=m>Nhận biết <b>màng tế bào – tế bào chất – vùng chứa vật chất di truyền</b>.</p><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),W=800,H=600,C=5,R=4,pw=160,ph=150;let ps=[],d=null,ox,oy;let s=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><radialGradient id="a"><stop stop-color="#effcff"/><stop offset="1" stop-color="#8fd3e8"/></radialGradient><radialGradient id="n"><stop stop-color="#ffb56b"/><stop offset="1" stop-color="#df6b23"/></radialGradient></defs><rect width="800" height="600" fill="url(#a)"/><rect x="70" y="145" width="660" height="310" rx="155" fill="#73c9df" stroke="#1f6f8a" stroke-width="20"/><rect x="95" y="170" width="610" height="260" rx="130" fill="#c7f2f8" stroke="#62b8cf" stroke-width="8"/><path d="M190 300q80-100 180 0t220 0" fill="none" stroke="#54a9bf" stroke-width="28" opacity=".7"/><path d="M315 290q35-65 100-20t-10 70q-65 45-90-20z" fill="url(#n)" stroke="#9a4618" stroke-width="8"/><circle cx="390" cy="300" r="14" fill="#ffe3b7"/><g fill="#55b85a" stroke="#267f38" stroke-width="4"><circle cx="175" cy="250" r="13"/><circle cx="610" cy="360" r="13"/><circle cx="225" cy="385" r="13"/></g><text x="400" y="520" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#245b91">TẾ BÀO NHÂN SƠ</text></svg>`;let im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);im.onload=init;function init(){ps=[];for(let r=0;r<R;r++)for(let q=0;q<C;q++)ps.push({r,q,hx:q*pw,hy:r*ph,x:0,y:0,t:{t:r?1:0,l:q?-1:0,r:q<C-1?1:0,b:r<R-1?1:0},ok:false});mix()}function mix(){ps.forEach(p=>{p.x=Math.random()*(W-pw);p.y=Math.random()*(H-ph);p.ok=false});draw()}function path(p){let X=p.x,Y=p.y;g.beginPath();g.moveTo(X,Y);g.lineTo(X+70,Y);if(p.t.t)g.arc(X+80,Y,10,Math.PI,0,true);g.lineTo(X+pw,Y);g.lineTo(X+pw,Y+60);if(p.t.r)g.arc(X+pw,Y+75,10,-Math.PI/2,Math.PI/2);g.lineTo(X+pw,Y+ph);g.lineTo(X+90,Y+ph);if(p.t.b)g.arc(X+80,Y+ph,10,0,Math.PI);g.lineTo(X,Y+ph);g.lineTo(X,Y+90);if(p.t.l)g.arc(X,Y+75,10,Math.PI/2,-Math.PI/2);g.closePath()}function draw(){g.clearRect(0,0,W,H);g.globalAlpha=.12;g.drawImage(im,0,0);g.globalAlpha=1;ps.forEach(p=>{g.save();path(p);g.clip();g.drawImage(im,p.q*pw,p.r*ph,pw,ph,p.x,p.y,pw,ph);g.restore();path(p);g.strokeStyle='#245b91';g.lineWidth=3;g.stroke()})}function pos(e){let z=c.getBoundingClientRect();return{x:(e.clientX-z.left)*W/z.width,y:(e.clientY-z.top)*H/z.height}}c.onpointerdown=e=>{let z=pos(e);for(let i=ps.length-1;i>=0;i--){let p=ps[i];if(z.x>p.x-15&&z.x<p.x+pw+15&&z.y>p.y-15&&z.y<p.y+ph+15){d=p;ox=z.x-p.x;oy=z.y-p.y;break}}};c.onpointermove=e=>{if(d){let z=pos(e);d.x=z.x-ox;d.y=z.y-oy;draw()}};c.onpointerup=()=>{if(!d)return;if(Math.hypot(d.x-d.hx,d.y-d.hy)<30){d.x=d.hx;d.y=d.hy;d.ok=true}d=null;draw();if(ps.every(p=>p.ok))m.innerHTML='🎉 <b style="color:#16823a">Hoàn thành! Em đã ghép đúng tế bào nhân sơ.</b>'}</script></html>
